UserParameter=bond.check[*],grep '$2' /proc/net/bonding/$1 -A6 | grep '$3' -m 1 | sed -n -e 's/^.*: //p'
UserParameter=bond.discovery,bond_list=$(ls /proc/net/bonding/);echo -n '{"data":[';for b in ${bond_list}; do echo -n "{\"{#BOND_IF}\": \"$b\"},";done |sed -e 's:\},$:\}:';echo -n ']}';
UserParameter=bond.slave.discovery,bond_list=$(ls /proc/net/bonding/); echo -n '{"data":['; first=1; for b in ${bond_list}; do if_list=$(grep 'Slave Interface' /proc/net/bonding/${b} | sed -n 's/^.*: //p'); for i in ${if_list}; do [ $first -eq 0 ] && echo -n ','; first=0; echo -n "{\"{#BOND_IF}\":\"$b\",\"{#SLAVE_IF}\":\"$i\"}"; done; done; echo ']}'
